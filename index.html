<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#1B1D1F;
    --surface:#232629;
    --surface-raised:#2C3033;
    --ink:#EDEAE2;
    --ink-dim:#9BA1A6;
    --accent:#E8A33D;
    --accent-2:#5B8AA6;
    --danger:#C24A3E;
    --good:#79996A;
    --border:#3A3F43;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:600;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--accent);color:#1B1D1F;}
  a{color:var(--accent-2);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:var(--surface);
    border-bottom:2px solid var(--accent);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:6px;
    background:#000;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;padding:2px;}
  .brand-name{font-size:15px;letter-spacing:0.06em;}
  .brand-sub{font-size:10px;color:var(--ink-dim);letter-spacing:0.08em;margin-top:1px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .role-tag{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    padding:3px 8px;border-radius:3px;letter-spacing:0.05em;
    border:1px solid var(--border);color:var(--ink-dim);
  }
  .btn-plain{
    background:none;border:none;color:var(--ink-dim);
    font-size:13px;padding:6px;
  }
  .btn-plain:hover{color:var(--ink);}

  main{flex:1;padding:18px;max-width:900px;margin:0 auto;width:100%;padding-bottom:calc(80px + env(safe-area-inset-bottom));}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent);color:#1B1D1F;
    border:none;border-radius:5px;
    padding:10px 16px;font-weight:600;font-size:13px;
    letter-spacing:0.02em;
  }
  .btn:active{transform:translateY(1px);}
  .btn-secondary{
    background:transparent;color:var(--ink);
    border:1px solid var(--border);
  }
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-block{width:100%;justify-content:center;}

  /* ---------- cards / lists ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .list-item{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;margin-bottom:10px;
    transition:border-color .15s;
  }
  .list-item:active{border-color:var(--accent);}
  .li-name{font-weight:600;font-size:15px;}
  .li-sub{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .chevron{color:var(--ink-dim);font-size:18px;}

  .status-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
    padding:4px 8px;border-radius:20px;border:1px solid;
  }
  .status-Teardown{color:#C79B6E;border-color:#C79B6E;}
  .status-Machining{color:var(--accent-2);border-color:var(--accent-2);}
  .status-Assembly{color:var(--accent);border-color:var(--accent);}
  .status-Dyno{color:#B36FC4;border-color:#B36FC4;}
  .status-Complete{color:var(--good);border-color:var(--good);}

  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:22px 0 12px;
  }
  .section-head h2{font-size:15px;margin:0;color:var(--ink);}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--accent);letter-spacing:0.08em;margin-bottom:4px;
    display:block;
  }
  .empty{
    text-align:center;padding:36px 20px;color:var(--ink-dim);
    font-size:13px;border:1px dashed var(--border);border-radius:8px;
  }

  /* ---------- forms ---------- */
  label{font-size:12px;color:var(--ink-dim);display:block;margin:12px 0 5px;letter-spacing:0.02em;}
  input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{
    width:100%;background:var(--surface-raised);
    border:1px solid var(--border);border-radius:6px;
    padding:10px 12px;color:var(--ink);font-size:14px;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  @media(min-width:600px){.overlay{align-items:center;}}
  .modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px 12px 0 0;padding:20px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  }
  @media(min-width:600px){.modal{border-radius:12px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
  .tab{
    background:none;border:none;color:var(--ink-dim);
    padding:10px 4px;font-size:13px;font-weight:600;
    letter-spacing:0.03em;text-transform:uppercase;
    border-bottom:2px solid transparent;margin-right:18px;
    white-space:nowrap;
  }
  .tab.active{color:var(--accent);border-color:var(--accent);}

  /* ---------- spec sheet ---------- */
  .spec-section{
    border:1px solid var(--border);border-radius:8px;
    background:var(--surface);margin-bottom:16px;overflow:hidden;
  }
  .spec-section-head{
    padding:10px 14px;background:var(--surface-raised);
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;
    border-bottom:1px solid var(--border);
  }
  .spec-section-body{padding:12px 14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
  .field-row.cols4{grid-template-columns:repeat(4,1fr);}
  .field-row.cols2{grid-template-columns:1fr 1fr;}
  @media(max-width:480px){.field-row.cols4{grid-template-columns:repeat(2,1fr);}}
  .field{margin-bottom:2px;}
  .field label{margin:0 0 4px;}
  .field .unit{font-size:10px;color:var(--ink-dim);margin-left:4px;}
  .field input{padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;}
  .col-label{
    text-align:center;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-dim);margin-bottom:4px;
  }

  .radio-toggle{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-toggle-option{
    display:flex;align-items:center;gap:6px;
    background:var(--surface-raised);border:1px solid var(--border);
    border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;
    flex:1;min-width:140px;justify-content:center;
  }
  .radio-toggle-option:has(input:checked){
    border-color:var(--accent);color:var(--accent);background:rgba(232,163,61,0.08);
  }
  .radio-toggle-option input{width:auto;accent-color:var(--accent);}
  .radio-toggle-option input:disabled{cursor:default;}
  .radio-toggle-option:has(input:disabled){cursor:default;opacity:0.75;}

  .vlift-table{width:100%;border-collapse:collapse;}
  .vlift-table th{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-2);
    text-transform:uppercase;letter-spacing:0.05em;padding:6px 4px;text-align:left;
    border-bottom:1px solid var(--border);
  }
  .vlift-table td{padding:3px;border-bottom:1px solid var(--border);}
  .vlift-cell{display:flex;flex-direction:column;min-width:78px;}
  .vlift-table input{
    background:none;border:none;padding:5px 4px 0;
    font-family:'JetBrains Mono',monospace;font-size:12px;width:100%;
  }
  .vlift-mm{
    font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-dim);
    padding:0 4px 4px;white-space:nowrap;
  }
  .vlift-table input:focus{outline:none;background:var(--surface-raised);}
  .vlift-wrap{overflow-x:auto;}
  .vlift-cell{transition:background-color .15s;border-radius:4px;}
  .vlift-cell.vlift-green{background:rgba(121,153,106,0.22);}
  .vlift-cell.vlift-orange{background:rgba(232,163,61,0.22);}
  .vlift-cell.vlift-red{background:rgba(194,74,62,0.28);}
  .legend-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:4px;vertical-align:middle;
  }
  .legend-dot.vlift-green{background:var(--good);}
  .legend-dot.vlift-orange{background:var(--accent);}
  .legend-dot.vlift-red{background:var(--danger);}
  .icon-btn{
    background:none;border:none;color:var(--ink-dim);
    font-size:15px;padding:4px 6px;
  }
  .icon-btn:hover{color:var(--danger);}

  .save-bar{
    position:sticky;bottom:0;background:var(--bg);
    padding:12px 0;margin-top:4px;
    display:flex;align-items:center;gap:10px;
    border-top:1px solid var(--border);
  }
  .save-status{font-size:12px;color:var(--ink-dim);}

  /* ---------- notes ---------- */
  .note-card{
    background:var(--surface);border:1px solid var(--border);
    border-left:3px solid var(--accent-2);
    border-radius:6px;padding:12px 14px;margin-bottom:10px;
  }
  .note-meta{font-size:11px;color:var(--ink-dim);margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .note-body{font-size:14px;white-space:pre-wrap;}

  /* ---------- photos ---------- */
  .photo-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:10px;
  }
  .photo-thumb{
    aspect-ratio:1;border-radius:8px;overflow:hidden;
    border:1px solid var(--border);position:relative;background:var(--surface-raised);
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-del-btn{
    position:absolute;top:4px;right:4px;z-index:2;
    width:22px;height:22px;border-radius:50%;
    background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.2);
    color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .photo-del-btn:hover{background:var(--danger);}
  .photo-cap{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,0.75));
    color:#fff;font-size:10px;padding:14px 6px 5px;
  }
  .photo-full-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.92);
    display:flex;align-items:center;justify-content:center;
    z-index:60;padding:20px;
  }
  .photo-full-overlay img{max-width:100%;max-height:85vh;border-radius:6px;}

  /* ---------- login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{width:100%;max-width:360px;}
  .login-logo{text-align:center;margin-bottom:24px;}
  .login-logo .brand-mark{margin:0 auto 12px;width:52px;height:52px;font-size:22px;border-radius:8px;}
  .login-error{
    color:var(--danger);font-size:12px;margin-top:10px;
    display:none;
  }

  .breadcrumb{font-size:12px;color:var(--ink-dim);margin-bottom:4px;background:none;border:none;padding:0;}
  .breadcrumb:hover{color:var(--accent);}
  .crumbs{margin-bottom:6px;}
  .crumbs span{color:var(--ink-dim);margin:0 4px;font-size:12px;}

  .loading{text-align:center;padding:40px;color:var(--ink-dim);font-size:13px;}
  .fab-add{
    position:fixed;right:18px;z-index:15;
    bottom:calc(18px + env(safe-area-inset-bottom));
    width:52px;height:52px;border-radius:50%;
    background:var(--accent);color:#1B1D1F;border:none;
    font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
/* ============================================================
   SUPABASE CLIENT
   ============================================================ */
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

/* ============================================================
   APP STATE / ROUTER
   Hierarchy: customers -> engines (per customer) -> rebuilds
   (dated instances of that engine) -> spec sheet / notes / photos
   ============================================================ */
const state = {
  session: null,
  profile: null,
  view: 'loading',       // loading | login | customers | customer | engine | rebuild | search
  customerId: null,
  engineId: null,
  rebuildId: null,
  rebuildTab: 'sheet',    // sheet | notes | photos
};

const $app = document.getElementById('app');
function h(html){ $app.innerHTML = html; }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; return new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(d){ if(!d) return ''; return new Date(d).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function v(x){ return x==null ? '' : x; }

function isInviteOrRecoveryLink(){
  const hash = window.location.hash || '';
  return hash.includes('type=invite') || hash.includes('type=recovery');
}

async function init(){
  state.mustSetPassword = isInviteOrRecoveryLink();

  sb.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if(event === 'PASSWORD_RECOVERY' || (session && state.mustSetPassword)){
      renderSetPassword();
      return;
    }
    if(!session){ state.profile=null; state.view='login'; render(); }
  });

  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(session && state.mustSetPassword){ renderSetPassword(); return; }
  if(session){ await loadProfile(); } else { state.view='login'; render(); }
}

/* ---------- SET PASSWORD (first login via an invite/reset email) ---------- */
function renderSetPassword(){
  h(`
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-mark"><img src="icon.png" alt="RevBuilt"></div>
        <h1 style="font-size:18px;margin:0 0 4px;">Set your password</h1>
        <div style="font-size:12px;color:var(--ink-dim);letter-spacing:0.05em;">CHOOSE A PASSWORD TO FINISH SETTING UP YOUR LOGIN</div>
      </div>
      <div class="card">
        <label>New password</label>
        <input type="password" id="newpass1" autocomplete="new-password" placeholder="At least 6 characters">
        <label>Confirm password</label>
        <input type="password" id="newpass2" autocomplete="new-password" placeholder="Re-type password">
        <button class="btn btn-block" style="margin-top:18px" onclick="submitNewPassword()">Set password &amp; continue</button>
        <div class="login-error" id="setpass-error"></div>
      </div>
    </div>
  </div>`);
}
async function submitNewPassword(){
  const p1 = document.getElementById('newpass1').value;
  const p2 = document.getElementById('newpass2').value;
  const errEl = document.getElementById('setpass-error');
  errEl.style.display='none';
  if(!p1 || p1.length < 6){ errEl.textContent='Password must be at least 6 characters.'; errEl.style.display='block'; return; }
  if(p1 !== p2){ errEl.textContent="Passwords don't match."; errEl.style.display='block'; return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ errEl.textContent = error.message; errEl.style.display='block'; return; }
  state.mustSetPassword = false;
  history.replaceState(null, '', window.location.pathname + window.location.search);
  h(`<div class="loading">Signing you in…</div>`);
  await loadProfile();
}
window.submitNewPassword = submitNewPassword;

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(error || !data){ h(`<div class="loading">Couldn't load your account. Try refreshing, or contact the shop.</div>`); return; }
  state.profile = data;
  if(data.role === 'admin'){
    state.view = 'customers';
  } else {
    state.view = 'customer';
    state.customerId = data.customer_id;
    if(!data.customer_id){
      h(`<div class="login-wrap"><div class="card" style="max-width:360px;text-align:center;">
        <p>Your login works, but the shop hasn't linked your account to a customer profile yet. Check back soon, or give them a call.</p>
        <button class="btn btn-secondary" style="margin-top:12px" onclick="signOut()">Sign out</button>
      </div></div>`);
      return;
    }
  }
  render();
}

function signOut(){ sb.auth.signOut(); }
window.signOut = signOut;

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  if(state.view === 'login') return renderLogin();
  renderShell();
}

function topbar(){
  const isAdmin = state.profile?.role === 'admin';
  return `
  <div class="topbar">
    <div class="brand" style="cursor:pointer" onclick="goHome()">
      <div class="brand-mark"><img src="icon.png" alt="RevBuilt"></div>
      <div>
        <div class="brand-name">REV BUILT</div>
        <div class="brand-sub">${isAdmin ? 'SHOP ADMIN' : 'CUSTOMER VIEW'}</div>
      </div>
    </div>
    <div class="topbar-right">
      ${isAdmin ? `<button class="btn-plain" onclick="openSearch()" title="Search by engine number" style="font-size:16px;">🔍</button>` : ''}
      ${isAdmin ? `<button class="btn-plain" onclick="openBackup()" title="Backup & restore" style="font-size:16px;">💾</button>` : ''}
      <span class="role-tag">${esc(state.profile?.email||'')}</span>
      <button class="btn-plain" onclick="signOut()" title="Sign out">⏻</button>
    </div>
  </div>`;
}
function openSearch(){ state.view='search'; render(); }
window.openSearch = openSearch;
function openBackup(){ state.view='backup'; render(); }
window.openBackup = openBackup;
function goHome(){
  if(state.profile.role==='admin'){ state.view='customers'; }
  else { state.view='customer'; }
  render();
}
window.goHome = goHome;

function renderShell(){
  h(`<div>${topbar()}<main id="main"><div class="loading">Loading…</div></main></div>`);
  const main = document.getElementById('main');
  if(state.view === 'customers') return renderCustomerList(main);
  if(state.view === 'customer') return renderEngineList(main, state.customerId);
  if(state.view === 'engine') return renderRebuildList(main, state.engineId);
  if(state.view === 'rebuild') return renderRebuildDetail(main, state.rebuildId);
  if(state.view === 'search') return renderSearch(main);
  if(state.view === 'backup') return renderBackup(main);
}

/* ============================================================
   LOGIN
   ============================================================ */
function renderLogin(){
  h(`
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-mark"><img src="icon.png" alt="RevBuilt"></div>
        <h1 style="font-size:18px;margin:0 0 4px;">RevBuilt</h1>
        <div style="font-size:12px;color:var(--ink-dim);letter-spacing:0.05em;">ENGINE BUILD MANAGEMENT</div>
      </div>
      <div class="card">
        <label>Email</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="you@example.com">
        <label>Password</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
        <button class="btn btn-block" style="margin-top:18px" onclick="doLogin()">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </div>
    </div>
  </div>`);
  document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display='none';
  if(!email || !password){ errEl.textContent='Enter your email and password.'; errEl.style.display='block'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });

/* ============================================================

   ============================================================ */
const BACKUP_TABLES = ['customers','engines','engine_ownership_history','rebuilds','rebuild_valve_rows','rebuild_notes','rebuild_photos'];

function renderBackup(main){
  main.innerHTML = `
    <button class="breadcrumb" onclick="goHome()">‹ Back</button>
    <span class="eyebrow">SHOP</span>
    <h2 style="margin:0 0 14px;font-size:20px;">Backup &amp; Restore</h2>

    <div class="card" style="margin-bottom:16px;">
      <div style="color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.05em;font-size:10px;margin-bottom:8px;font-family:'JetBrains Mono',monospace;">Export</div>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 12px;">
        Downloads every customer, engine, rebuild, spec sheet, note, and photo record as one file.
        This doesn't include the photo images themselves — those live in Supabase Storage independently and aren't affected by a restore.
        Logins aren't included either; those stay managed in Supabase.
      </p>
      <button class="btn" onclick="exportBackup()">Download backup</button>
      <div id="export-status" style="font-size:12px;color:var(--ink-dim);margin-top:10px;"></div>
    </div>

    <div class="card" style="border-color:var(--danger);">
      <div style="color:var(--danger);text-transform:uppercase;letter-spacing:0.05em;font-size:10px;margin-bottom:8px;font-family:'JetBrains Mono',monospace;">Restore — destructive</div>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 12px;">
        This <strong>erases all current customers, engines, and rebuild data</strong> and replaces it with what's in the file you choose.
        Only do this if something has actually gone wrong — there's no undo once it runs.
      </p>
      <label style="margin-top:0;">Backup file</label>
      <input type="file" id="restore-file" accept="application/json">
      <label>Type RESTORE to confirm</label>
      <input type="text" id="restore-confirm" placeholder="RESTORE">
      <button class="btn btn-danger" style="margin-top:12px;" onclick="restoreBackup()">Restore from backup</button>
      <div id="restore-status" style="font-size:12px;color:var(--ink-dim);margin-top:10px;"></div>
    </div>
  `;
}

async function exportBackup(){
  const statusEl = document.getElementById('export-status');
  statusEl.textContent = 'Gathering data…';
  const backup = { app: 'revbuilt', version: 1, exported_at: new Date().toISOString(), data: {} };
  for(const t of BACKUP_TABLES){
    const { data, error } = await sb.from(t).select('*');
    if(error){ statusEl.textContent = `Export failed on ${t}: ${error.message}`; return; }
    backup.data[t] = data;
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `revbuilt-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  statusEl.textContent = 'Downloaded ✓';
  setTimeout(() => { if(statusEl) statusEl.textContent=''; }, 3000);
}
window.exportBackup = exportBackup;

async function restoreBackup(){
  const fileInput = document.getElementById('restore-file');
  const confirmInput = document.getElementById('restore-confirm');
  const statusEl = document.getElementById('restore-status');

  if(confirmInput.value.trim() !== 'RESTORE'){ statusEl.textContent = 'Type RESTORE (all caps) to confirm.'; return; }
  const file = fileInput.files[0];
  if(!file){ statusEl.textContent = 'Choose a backup file first.'; return; }

  statusEl.textContent = 'Reading file…';
  let backup;
  try{ backup = JSON.parse(await file.text()); }
  catch(e){ statusEl.textContent = 'That file is not valid JSON.'; return; }
  if(!backup?.data?.customers){ statusEl.textContent = "That doesn't look like a RevBuilt backup file."; return; }

  if(!confirm('This will ERASE all current customers, engines, and rebuild data and replace it with the backup. Logins are not affected. This cannot be undone. Continue?')) {
    statusEl.textContent = '';
    return;
  }

  statusEl.textContent = 'Erasing current data…';
  const { error: delErr } = await sb.from('customers').delete().neq('id', '00000000-0000-0000-0000-000000000000');
  if(delErr){ statusEl.textContent = `Erase failed: ${delErr.message}`; return; }

  for(const t of BACKUP_TABLES){
    const rows = backup.data[t];
    if(rows && rows.length){
      statusEl.textContent = `Restoring ${t} (${rows.length} rows)…`;
      const { error } = await sb.from(t).insert(rows);
      if(error){ statusEl.textContent = `Restore failed on ${t}: ${error.message}. Earlier tables were already restored — check your data before trying again.`; return; }
    }
  }
  statusEl.textContent = 'Restore complete ✓';
  setTimeout(() => goHome(), 1500);
}
window.restoreBackup = restoreBackup;

    <button class="breadcrumb" onclick="openEngine('${rebuild.engines.id}')">‹ ${esc(rebuild.engines.label)}</button>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div>
        <span class="eyebrow">REBUILD</span>
        <h2 style="margin:0 0 2px;font-size:20px;">${fmtDate(rebuild.rebuild_date)}</h2>
      </div>
      ${isAdmin ? `
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <select id="status-select" class="status-badge status-${rebuild.status}" style="background:var(--surface);width:auto;padding:6px 8px;" onchange="updateStatus('${rebuild.id}', this.value)">
            ${['Teardown','Machining','Assembly','Dyno','Complete'].map(s=>`<option value="${s}" ${s===rebuild.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-danger btn-sm" onclick="deleteRebuild('${rebuild.id}', '${rebuild.engines.id}')">Delete</button>
        </div>
      ` : `<span class="status-badge status-${rebuild.status}">${rebuild.status}</span>`}
    </div>

    <div class="tabs" style="margin-top:18px;">
      <button class="tab ${state.rebuildTab==='sheet'?'active':''}" onclick="switchTab('sheet')">Spec sheet</button>
      <button class="tab ${state.rebuildTab==='notes'?'active':''}" onclick="switchTab('notes')">Notes</button>
      <button class="tab ${state.rebuildTab==='photos'?'active':''}" onclick="switchTab('photos')">Photos</button>
    </div>
    <div id="tab-content"><div class="loading">Loading…</div></div>
  `;
  loadTab(rebuildId, rebuild);
}
window.switchTab = function(tab){ state.rebuildTab = tab; render(); };
async function updateStatus(rebuildId, status){
  await sb.from('rebuilds').update({status}).eq('id', rebuildId);
}
window.updateStatus = updateStatus;

async function deleteRebuild(rebuildId, engineId){
  if(!confirm('Delete this rebuild — its spec sheet, notes, and photos? This cannot be undone.')) return;
  const { data: photos } = await sb.from('rebuild_photos').select('storage_path').eq('rebuild_id', rebuildId);
  const paths = (photos||[]).map(p => p.storage_path);
  if(paths.length) await sb.storage.from('engine-photos').remove(paths);
  const { error } = await sb.from('rebuilds').delete().eq('id', rebuildId);
  if(error){ alert(error.message); return; }
  openEngine(engineId);
}
window.deleteRebuild = deleteRebuild;

async function loadTab(rebuildId, rebuild){
  if(state.rebuildTab==='sheet') return loadSpecSheet(rebuildId, rebuild);
  if(state.rebuildTab==='notes') return loadNotes(rebuildId);
  if(state.rebuildTab==='photos') return loadPhotos(rebuildId);
}

/* ---------- SPEC SHEET (matches the paper form) ---------- */
const CYL_FIELDS = [
  ['cc', "CC's"],
  ['stroke', 'Stroke'],
  ['main_bearing', 'Main Bearing Clearance'],
  ['big_end_bearing', 'Big End Bearing Clearance'],
  ['cam_bearing', 'Cam Bearing Clearance'],
  ['crank_main_size', 'Crank Main Size'],
  ['crank_big_end_size', 'Crank Big End Size'],
];
const WEIGHT_FIELDS = [
  ['crank_weight_kg', 'Crank Weight', 'Kg'],
  ['flywheel_weight_kg', 'Flywheel Weight', 'Kg'],
  ['conrod_weight_g', 'Conrod Weight', 'G'],
  ['piston_weight_g', 'Piston Weight', 'G'],
  ['cam_timing_deg', 'Cam Timing', 'Deg'],
  ['deck_height', 'Deck Height', ''],
];

async function loadSpecSheet(rebuildId, rebuild){
  const isAdmin = state.profile.role === 'admin';
  const el = document.getElementById('tab-content');
  if(!rebuild){
    const { data } = await sb.from('rebuilds').select('*').eq('id', rebuildId).single();
    rebuild = data;
  }
  const { data: vrows, error } = await sb.from('rebuild_valve_rows').select('*').eq('rebuild_id', rebuildId).order('position');
  if(error){ el.innerHTML = `<div class="empty">Couldn't load spec sheet.</div>`; return; }
  const dis = isAdmin ? '' : 'readonly';

  el.innerHTML = `
    <div class="spec-section">
      <div class="spec-section-head">Weights &amp; Timing</div>
      <div class="spec-section-body">
        <div class="field-row cols2">
          ${WEIGHT_FIELDS.map(([key,label,unit]) => `
            <div class="field">
              <label>${label}${unit?`<span class="unit">(${unit})</span>`:''}</label>
              <input type="text" id="sf-${key}" value="${esc(v(rebuild[key]))}" ${dis}>
            </div>
          `).join('')}
        </div>
        <div class="field" style="margin-top:6px;">
          <label>Crank Type</label>
          <div class="radio-toggle">
            ${['Counterweighted','Standard'].map(opt => `
              <label class="radio-toggle-option">
                <input type="radio" name="sf-crank_type" value="${opt}" ${rebuild.crank_type===opt?'checked':''} ${isAdmin?'':'disabled'}>
                <span>${opt}</span>
              </label>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="spec-section">
      <div class="spec-section-head">Per Cylinder</div>
      <div class="spec-section-body">
        <div class="field-row cols4" style="margin-bottom:2px;">
          <div class="col-label">1</div><div class="col-label">2</div><div class="col-label">3</div><div class="col-label">4</div>
        </div>
        ${CYL_FIELDS.map(([key,label]) => `
          <div style="margin-bottom:10px;">
            <label style="margin:0 0 4px;">${label}</label>
            <div class="field-row cols4">
              ${[1,2,3,4].map(n => `<input type="text" id="sf-${key}_${n}" value="${esc(v(rebuild[key+'_'+n]))}" ${dis}>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="spec-section">
      <div class="spec-section-head">Valve Lift</div>
      <div class="spec-section-body">
        <div style="font-size:11px;color:var(--ink-dim);margin-bottom:8px;">Enter in thou (inches, up to 5 decimal places) — mm shown alongside</div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--ink-dim);margin-bottom:10px;font-family:'JetBrains Mono',monospace;">
          <span><span class="legend-dot vlift-green"></span> ≥0.003" under max</span>
          <span><span class="legend-dot vlift-orange"></span> 0.0005"–0.003" under max</span>
          <span><span class="legend-dot vlift-red"></span> at/over max</span>
        </div>
        <div class="vlift-wrap">
          <table class="vlift-table">
            <thead><tr>
              <th>1 EX</th><th>1 IN</th><th>2 IN</th><th>2 EX</th>
              <th>3 EX</th><th>3 IN</th><th>4 IN</th><th>4 EX</th>
              ${isAdmin ? '<th></th>' : ''}
            </tr></thead>
            <tbody id="vlift-body">
              ${vrows.map(r => vliftRowHtml(r, isAdmin)).join('')}
            </tbody>
          </table>
        </div>
        ${isAdmin ? `<button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="addVliftRow('${rebuildId}')">+ Add row</button>` : (vrows.length===0 ? `<div class="empty" style="margin-top:10px;">No readings yet.</div>` : '')}
      </div>
    </div>

    <div class="spec-section">
      <div class="spec-section-head">Pushrod Length</div>
      <div class="spec-section-body">
        <div class="field-row cols4" style="margin-bottom:2px;">
          <div class="col-label">1</div><div class="col-label">2</div><div class="col-label">3</div><div class="col-label">4</div>
        </div>
        <div style="margin-bottom:10px;">
          <label style="margin:0 0 4px;">In</label>
          <div class="field-row cols4">
            ${[1,2,3,4].map(n => `<input type="text" id="sf-pushrod_in_${n}" value="${esc(v(rebuild['pushrod_in_'+n]))}" ${dis}>`).join('')}
          </div>
        </div>
        <div>
          <label style="margin:0 0 4px;">Ex</label>
          <div class="field-row cols4">
            ${[1,2,3,4].map(n => `<input type="text" id="sf-pushrod_ex_${n}" value="${esc(v(rebuild['pushrod_ex_'+n]))}" ${dis}>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="spec-section">
      <div class="spec-section-head">Head &amp; Seals</div>
      <div class="spec-section-body">
        <div class="field-row cols2">
          <div class="field"><label>Head 1+2</label><input type="text" id="sf-head_1_2" value="${esc(v(rebuild.head_1_2))}" ${dis}></div>
          <div class="field"><label>Head 3+4</label><input type="text" id="sf-head_3_4" value="${esc(v(rebuild.head_3_4))}" ${dis}></div>
        </div>
        <div class="field-row cols2">
          <div class="field"><label>Main Case Seal</label><input type="text" id="sf-main_case_seal" value="${esc(v(rebuild.main_case_seal))}" ${dis}></div>
          <div class="field"><label>Sealer</label><input type="text" id="sf-sealer" value="${esc(v(rebuild.sealer))}" ${dis}></div>
        </div>
      </div>
    </div>

    <div class="spec-section">
      <div class="spec-section-head">Piston</div>
      <div class="spec-section-body">
        <div class="field-row cols2">
          <div class="field"><label>Piston to Bore</label><input type="text" id="sf-piston_to_bore" value="${esc(v(rebuild.piston_to_bore))}" ${dis}></div>
          <div class="field"><label>Piston Size</label><input type="text" id="sf-piston_size" value="${esc(v(rebuild.piston_size))}" ${dis}></div>
        </div>
      </div>
    </div>

    ${isAdmin ? `
    <div class="save-bar">
      <button class="btn" onclick="saveSpecSheet('${rebuildId}')">Save spec sheet</button>
      <span class="save-status" id="save-status"></span>
    </div>` : ''}
  `;
}

// Max valve lift specs — used to color-code how close each reading is to the limit
const MAX_LIFT_MM = { intake: 9.9, exhaust: 9.5 };
function vliftStatusClass(fieldKey, val){
  const n = parseFloat(val);
  if(isNaN(n)) return '';
  const isIntake = fieldKey.includes('_in');
  const maxInches = (isIntake ? MAX_LIFT_MM.intake : MAX_LIFT_MM.exhaust) / 25.4;
  const margin = maxInches - n; // headroom below max, in inches
  if(margin < 0.0005) return 'vlift-red';
  if(margin < 0.003) return 'vlift-orange';
  return 'vlift-green';
}
function thouToMm(val){
  const n = parseFloat(val);
  if(isNaN(n)) return '';
  return `(${(n*25.4).toFixed(4)} mm)`;
}
function updateMmDisplay(inputEl){
  const span = inputEl.nextElementSibling;
  if(span && span.classList.contains('vlift-mm')) span.textContent = thouToMm(inputEl.value);
  const cell = inputEl.closest('.vlift-cell');
  if(cell){
    cell.classList.remove('vlift-green','vlift-orange','vlift-red');
    const cls = vliftStatusClass(inputEl.dataset.field, inputEl.value);
    if(cls) cell.classList.add(cls);
  }
}
window.updateMmDisplay = updateMmDisplay;

function vliftRowHtml(r, isAdmin){
  const dis = isAdmin ? '' : 'readonly';
  const cols = ['c1_ex','c1_in','c2_in','c2_ex','c3_ex','c3_in','c4_in','c4_ex'];
  return `<tr data-id="${r.id}">
    ${cols.map(c => `<td>
      <div class="vlift-cell ${vliftStatusClass(c, r[c])}">
        <input type="text" inputmode="decimal" value="${esc(v(r[c]))}" data-field="${c}" ${dis} onchange="saveVliftCell(this)" oninput="updateMmDisplay(this)">
        <span class="vlift-mm">${thouToMm(v(r[c]))}</span>
      </div>
    </td>`).join('')}
    ${isAdmin ? `<td><button class="icon-btn" onclick="deleteVliftRow('${r.id}')" title="Remove row">✕</button></td>` : ''}
  </tr>`;
}
async function addVliftRow(rebuildId){
  const { data: existing } = await sb.from('rebuild_valve_rows').select('position').eq('rebuild_id', rebuildId).order('position',{ascending:false}).limit(1);
  const nextPos = existing && existing.length ? existing[0].position + 1 : 0;
  const { error } = await sb.from('rebuild_valve_rows').insert({ rebuild_id: rebuildId, position: nextPos });
  if(error){ alert(error.message); return; }
  loadSpecSheet(rebuildId);
}
window.addVliftRow = addVliftRow;
async function saveVliftCell(inputEl){
  const row = inputEl.closest('tr');
  const id = row.dataset.id;
  const field = inputEl.dataset.field;
  let value = inputEl.value.trim();
  // clamp to 5 decimal places if it's a valid number
  const n = parseFloat(value);
  if(!isNaN(n) && value.includes('.') && value.split('.')[1].length > 5){
    value = n.toFixed(5);
    inputEl.value = value;
    updateMmDisplay(inputEl);
  }
  const { error } = await sb.from('rebuild_valve_rows').update({ [field]: value }).eq('id', id);
  if(error){ alert(error.message); }
}
window.saveVliftCell = saveVliftCell;
async function deleteVliftRow(id){
  if(!confirm('Remove this row?')) return;
  await sb.from('rebuild_valve_rows').delete().eq('id', id);
  loadSpecSheet(state.rebuildId);
}
window.deleteVliftRow = deleteVliftRow;

async function saveSpecSheet(rebuildId){
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = 'Saving…';
  const payload = {};
  WEIGHT_FIELDS.forEach(([key]) => { payload[key] = document.getElementById('sf-'+key).value.trim() || null; });
  const crankTypeChecked = document.querySelector('input[name="sf-crank_type"]:checked');
  payload.crank_type = crankTypeChecked ? crankTypeChecked.value : null;
  CYL_FIELDS.forEach(([key]) => { [1,2,3,4].forEach(n => { payload[key+'_'+n] = document.getElementById('sf-'+key+'_'+n).value.trim() || null; }); });
  [1,2,3,4].forEach(n => {
    payload['pushrod_in_'+n] = document.getElementById('sf-pushrod_in_'+n).value.trim() || null;
    payload['pushrod_ex_'+n] = document.getElementById('sf-pushrod_ex_'+n).value.trim() || null;
  });
  ['head_1_2','head_3_4','main_case_seal','sealer','piston_to_bore','piston_size'].forEach(key => {
    payload[key] = document.getElementById('sf-'+key).value.trim() || null;
  });
  const { error } = await sb.from('rebuilds').update(payload).eq('id', rebuildId);
  statusEl.textContent = error ? ('Error: '+error.message) : 'Saved ✓';
  if(!error) setTimeout(() => { if(statusEl) statusEl.textContent=''; }, 2500);
}
window.saveSpecSheet = saveSpecSheet;

/* ---------- NOTES ---------- */
async function loadNotes(rebuildId){
  const isAdmin = state.profile.role === 'admin';
  const el = document.getElementById('tab-content');
  const { data: notes, error } = await sb.from('rebuild_notes').select('*').eq('rebuild_id', rebuildId).order('created_at', {ascending:false});
  if(error){ el.innerHTML = `<div class="empty">Couldn't load notes.</div>`; return; }

  el.innerHTML = `
    ${isAdmin ? `
    <div class="card" style="margin-bottom:16px;">
      <label style="margin-top:0;">Add a note</label>
      <textarea id="new-note" placeholder="e.g. Ran hot at the track after 20 laps — check oil cooler routing before next rebuild."></textarea>
      <button class="btn btn-sm" style="margin-top:10px;" onclick="addNote('${rebuildId}')">Save note</button>
    </div>` : ''}
    ${notes.length ? notes.map(n => `
      <div class="note-card">
        <div style="display:flex;justify-content:space-between;gap:10px;">
          <div class="note-body">${esc(n.body)}</div>
          ${isAdmin ? `<button class="icon-btn" style="flex-shrink:0;" onclick="deleteNote('${n.id}')" title="Delete note">✕</button>` : ''}
        </div>
        <div class="note-meta">${fmtDateTime(n.created_at)}${n.created_by_email ? ' · '+esc(n.created_by_email) : ''}</div>
      </div>
    `).join('') : `<div class="empty">No notes yet.</div>`}
  `;
}
async function deleteNote(id){
  if(!confirm('Delete this note?')) return;
  await sb.from('rebuild_notes').delete().eq('id', id);
  loadNotes(state.rebuildId);
}
window.deleteNote = deleteNote;
async function addNote(rebuildId){
  const body = document.getElementById('new-note').value.trim();
  if(!body) return;
  const { error } = await sb.from('rebuild_notes').insert({ rebuild_id: rebuildId, body, created_by_email: state.profile.email });
  if(error){ alert(error.message); return; }
  loadNotes(rebuildId);
}
window.addNote = addNote;

/* ---------- PHOTOS ---------- */
async function loadPhotos(rebuildId){
  const isAdmin = state.profile.role === 'admin';
  const el = document.getElementById('tab-content');
  const { data: photos, error } = await sb.from('rebuild_photos').select('*').eq('rebuild_id', rebuildId).order('created_at', {ascending:false});
  if(error){ el.innerHTML = `<div class="empty">Couldn't load photos.</div>`; return; }

  const urls = photos.map(p => ({...p, url: sb.storage.from('engine-photos').getPublicUrl(p.storage_path).data.publicUrl}));

  el.innerHTML = `
    ${isAdmin ? `
    <div class="card" style="margin-bottom:16px;">
      <label style="margin-top:0;">Add photos</label>
      <input type="file" id="photo-input" accept="image/*" capture="environment" multiple>
      <input type="text" id="photo-caption" placeholder="Caption (optional, applied to all selected)" style="margin-top:8px;">
      <button class="btn btn-sm" style="margin-top:10px;" onclick="uploadPhotos('${rebuildId}')">Upload</button>
      <div id="upload-status" style="font-size:12px;color:var(--ink-dim);margin-top:8px;"></div>
    </div>` : ''}
    <div class="photo-grid">
      ${urls.map(p => `
        <div class="photo-thumb" onclick="viewPhoto('${p.url}')">
          <img src="${p.url}" loading="lazy">
          ${isAdmin ? `<button class="photo-del-btn" onclick="event.stopPropagation(); deletePhoto('${p.id}', '${p.storage_path}')" title="Delete photo">✕</button>` : ''}
          ${p.caption ? `<div class="photo-cap">${esc(p.caption)}</div>` : ''}
        </div>
      `).join('')}
    </div>
    ${photos.length===0 ? `<div class="empty">No photos yet.</div>` : ''}
  `;
}
async function deletePhoto(id, storagePath){
  if(!confirm('Delete this photo?')) return;
  await sb.storage.from('engine-photos').remove([storagePath]);
  await sb.from('rebuild_photos').delete().eq('id', id);
  loadPhotos(state.rebuildId);
}
window.deletePhoto = deletePhoto;
async function uploadPhotos(rebuildId){
  const input = document.getElementById('photo-input');
  const caption = document.getElementById('photo-caption').value.trim();
  const statusEl = document.getElementById('upload-status');
  const files = input.files;
  if(!files || files.length===0){ return; }
  statusEl.textContent = `Uploading 0 / ${files.length}…`;
  let done = 0;
  for(const file of files){
    const path = `${rebuildId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name}`;
    const { error: upErr } = await sb.storage.from('engine-photos').upload(path, file);
    if(upErr){ statusEl.textContent = `Error: ${upErr.message}`; continue; }
    await sb.from('rebuild_photos').insert({ rebuild_id: rebuildId, storage_path: path, caption: caption || null });
    done++;
    statusEl.textContent = `Uploading ${done} / ${files.length}…`;
  }
  statusEl.textContent = `Done.`;
  loadPhotos(rebuildId);
}
window.uploadPhotos = uploadPhotos;
function viewPhoto(url){
  const overlay = document.createElement('div');
  overlay.className = 'photo-full-overlay';
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `<img src="${url}">`;
  document.body.appendChild(overlay);
}
window.viewPhoto = viewPhoto;

/* ============================================================
   MODAL HELPERS
   ============================================================ */
function showModal(innerHtml){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modal-overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(overlay);
}
function closeModal(){
  const el = document.getElementById('modal-overlay');
  if(el) el.remove();
}
window.closeModal = closeModal;

/* ============================================================
   PWA install (service worker)
   ============================================================ */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

init();
</script>
